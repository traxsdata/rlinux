# rlinux CI: build (clippy, -Werror), rustfmt, QEMU boot with Rust modules,
# and KUnit including the Rust doctests. The same ci/*.sh scripts run locally;
# see ci/README.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  LLVM: "-18"
  LIBCLANG_PATH: /usr/lib/llvm-18/lib

jobs:
  build-boot:
    name: build + rustfmt + boot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        id: setup
      # Warm runs skip recompiling the (C) kernel. The cache dir is
      # $CI_OUT/ccache (set in ci/lib.sh). Cache keys are immutable, so the
      # key ends in the commit SHA: every run saves a fresh cache, and the
      # restore-key prefixes pick the newest one with the same toolchain and
      # ci/ config (then any config) to start from.
      - name: ccache restore (x86_64)
        uses: actions/cache@v5
        with:
          path: .ci-out/ccache
          key: ccache-x86_64-clang${{ steps.setup.outputs.clang }}-rust${{ steps.setup.outputs.rustc }}-cfg${{ steps.setup.outputs.cfg }}-${{ github.sha }}
          restore-keys: |
            ccache-x86_64-clang${{ steps.setup.outputs.clang }}-rust${{ steps.setup.outputs.rustc }}-cfg${{ steps.setup.outputs.cfg }}-
            ccache-x86_64-
      - name: build
        run: ci/build.sh
      - name: rustfmt
        run: ci/rustfmt.sh
      - name: boot
        run: ci/boot.sh
      - name: upload serial log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boot-serial-log
          path: .ci-out/boot-serial.log
          if-no-files-found: ignore

  kunit:
    name: kunit (incl. Rust doctests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: kunit
        run: ci/kunit.sh

  cross-build:
    name: cross-build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    # Cross builds are slower than the native build job (~27 min cold on 16
    # local cores; 57 min to 1h25m observed on the GitHub runners, issue #30).
    # Ccache turns most later runs into warm runs; keep 120 min so the first
    # (cold) run of a new cache key still fits.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Kernel ARCH names (see ci/cross-build.sh).
        arch: [arm64, riscv]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        id: setup
      - name: ccache restore (${{ matrix.arch }})
        uses: actions/cache@v5
        with:
          path: .ci-out/${{ matrix.arch }}/ccache
          key: ccache-${{ matrix.arch }}-clang${{ steps.setup.outputs.clang }}-rust${{ steps.setup.outputs.rustc }}-cfg${{ steps.setup.outputs.cfg }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-clang${{ steps.setup.outputs.clang }}-rust${{ steps.setup.outputs.rustc }}-cfg${{ steps.setup.outputs.cfg }}-
            ccache-${{ matrix.arch }}-
      - name: cross-build ${{ matrix.arch }}
        run: ci/cross-build.sh ${{ matrix.arch }}
